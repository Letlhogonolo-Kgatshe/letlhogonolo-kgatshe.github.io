<!DOCTYPE html>
<html lang="en" data-style="midnight">
<head>
  <meta charset="UTF-8">
  <script>try{var s=localStorage.getItem('site-style');if(s==='quiet'||s==='showcase')document.documentElement.setAttribute('data-style',s);}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Letlhogonolo Kgatshe</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Inter+Tight:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b1020; --text: #e8ecf4; --muted: #9aa6bf; --accent: #8fb4ff; --glow: radial-gradient(900px 500px at 50% -10%, #1c2b52 0%, transparent 70%) no-repeat; --font: Geist; color-scheme: dark; }
    html[data-style="quiet"] { --bg: #f6f6f4; --text: #16181b; --muted: #5d6168; --accent: #0f766e; --glow: none; color-scheme: light; }
    html[data-style="showcase"] { --bg: #ffffff; --text: #0b0d10; --muted: #5b6170; --accent: #0f766e; --glow: none; --font: "Inter Tight"; color-scheme: light; }
    html[data-style="quiet"] h1, html[data-style="showcase"] h1 { font-family: var(--font), sans-serif; font-style: normal; font-weight: 600; letter-spacing: -0.05em; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--glow), var(--bg); color: var(--text); font-family: var(--font), system-ui, sans-serif; padding: 16px; text-align: center; }
    h1 { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; font-size: 5rem; margin: 0; letter-spacing: -0.02em; color: var(--accent); }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page doesn't exist, or it has moved.</p>
    <p><a href="/">Go to the homepage →</a></p>
  </main>
</body>
</html>
